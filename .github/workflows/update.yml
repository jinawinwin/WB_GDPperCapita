name: Update World Bank GDP per Capita data
on:
  schedule:
    - cron: "0 0 15 1,3,5,7,9,11 *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update.yml"
permissions:
  contents: write
concurrency:
  group: wb-gdp-per-capita-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch World Bank data
        run: python scripts/update_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gdp_per_capita.json data/gdp_per_capita.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update World Bank GDP per capita indicators"
            git push
          fi
